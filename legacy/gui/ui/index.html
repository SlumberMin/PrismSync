<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>神光同步</title>
<style>
  :root{
    --bg:#08090c;
    --panel:rgba(255,255,255,.035);
    --line:rgba(255,255,255,.085);
    --text:#e9ebf2;
    --dim:#8b90a3;
    --dim2:#5c6173;
    --accent:#7c5cff;
    --ok:#34d399;
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font:14px/1.5 "Segoe UI",system-ui,-apple-system,"Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;padding:24px 24px 18px;
  }
  body::before,body::after{
    content:"";position:fixed;border-radius:50%;filter:blur(130px);pointer-events:none;z-index:0;
  }
  body::before{width:540px;height:540px;left:-180px;top:-200px;background:#4c1d95;opacity:.42}
  body::after{width:480px;height:480px;right:-160px;bottom:-220px;background:#0e7490;opacity:.25}
  .wrap{position:relative;z-index:1;max-width:960px;margin:0 auto}

  /* header */
  header{display:flex;align-items:center;gap:13px;margin-bottom:18px}
  .logo{
    width:36px;height:36px;border-radius:11px;flex:0 0 auto;
    background:conic-gradient(from 210deg,#7c5cff,#22d3ee,#f472b6,#facc15,#7c5cff);
    box-shadow:0 0 24px rgba(124,92,255,.42);display:grid;place-items:center;
  }
  .logo i{width:14px;height:14px;border-radius:50%;background:#0a0b10;display:block}
  h1{font-size:16.5px;font-weight:600;letter-spacing:.2px;display:flex;align-items:baseline;gap:9px}
  h1 em{font-style:normal;font-size:10.5px;letter-spacing:2.2px;color:var(--dim2);font-weight:500}
  .status{margin-left:auto;display:flex;align-items:center;gap:15px;font-size:12.5px;color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim2);display:inline-block;
       margin-right:7px;transition:.3s}
  .dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .mono{font-variant-numeric:tabular-nums}

  /* ---- desk preview: headset | laptop | keyboard ---- */
  .desk{
    position:relative;border-radius:var(--radius);padding:15px 16px 13px;
    background:linear-gradient(180deg,rgba(255,255,255,.052),rgba(255,255,255,.014));
    border:1px solid var(--line);overflow:hidden;margin-bottom:14px;
  }
  .desk::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% -40%,rgba(124,92,255,.15),transparent 62%);
  }
  .desk-label{font-size:10.5px;letter-spacing:2.2px;color:var(--dim2);
              margin-bottom:11px;text-transform:uppercase}
  .stage{display:flex;align-items:center;gap:14px;height:112px}

  .unit{position:relative;display:flex;flex-direction:column;justify-content:center}
  .unit .lbl{font-size:10px;color:var(--dim2);text-align:center;margin-top:8px;letter-spacing:.4px}
  .unit .lbl b{color:var(--dim);font-weight:500}

  /* headset: rounded pill with a glow */
  .hs{flex:0 0 76px}
  .hs .body{height:36px;border-radius:18px;
            transition:background .12s linear,box-shadow .18s,border-color .18s}
  /* laptop: screen + single-zone bar */
  .nb{flex:0 0 150px}
  .nb .body{height:56px;border-radius:10px;position:relative;
            transition:background .12s linear,box-shadow .18s,border-color .18s}
  .nb .body::after{
    content:"";position:absolute;left:11px;right:11px;bottom:9px;height:3px;border-radius:2px;
    background:rgba(255,255,255,.28);
  }
  /* keyboard: real 5-row key matrix */
  .kb{flex:1;min-width:0;max-width:620px}
  .kbd{
    display:flex;flex-direction:column;gap:3px;padding:7px;border-radius:11px;
    background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.06);
  }
  .krow{display:flex;gap:3px}
  .krow span{flex:1 1 0;min-width:0;height:13px;border-radius:3px;
             transition:background .1s linear}

  /* ---- device cards ---- */
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:14px}
  .dev{
    position:relative;border-radius:14px;padding:13px;overflow:hidden;
    background:var(--panel);border:1px solid var(--line);
    display:flex;align-items:center;gap:11px;transition:border-color .3s;
  }
  .dev .glow{position:absolute;left:-26px;top:50%;transform:translateY(-50%);
             width:74px;height:74px;border-radius:50%;filter:blur(24px);opacity:.5;
             transition:background .18s}
  .dev .ico{position:relative;width:32px;height:32px;border-radius:9px;flex:0 0 auto;
            background:rgba(255,255,255,.055);display:grid;place-items:center;font-size:15px}
  .dev .meta{position:relative;min-width:0}
  .dev .nm{font-size:13px;font-weight:600;white-space:nowrap}
  .dev .sb{font-size:10.5px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dev .st{position:relative;margin-left:auto;font-size:10.5px;color:var(--dim2);white-space:nowrap}
  .dev .st.on{color:var(--ok)}

  /* ---- cards ---- */
  .card{border-radius:var(--radius);padding:15px;background:var(--panel);
        border:1px solid var(--line);margin-bottom:14px}
  .card h2{font-size:10.5px;letter-spacing:2.2px;color:var(--dim2);
           font-weight:600;text-transform:uppercase;margin-bottom:12px}
  .fx{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .fx button{
    appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.028);
    color:var(--text);border-radius:11px;padding:11px 10px;cursor:pointer;
    text-align:left;transition:.18s;font-family:inherit;
  }
  .fx button:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);transform:translateY(-1px)}
  .fx button .fx-n{font-size:12.5px;font-weight:600;display:block;margin-bottom:2px}
  .fx button .fx-d{font-size:10px;color:var(--dim2);line-height:1.35;display:block}
  .fx button.sel{
    border-color:transparent;
    background:linear-gradient(rgba(124,92,255,.15),rgba(34,211,238,.09)) padding-box,
               linear-gradient(135deg,#7c5cff,#22d3ee) border-box;
    box-shadow:0 0 20px rgba(124,92,255,.22);
  }
  .fx button.sel .fx-n{color:#fff}

  .sliders{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .sl label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:8px}
  .sl label b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
  input[type=range]{
    -webkit-appearance:none;width:100%;height:4px;border-radius:2px;outline:none;
    background:linear-gradient(90deg,var(--accent),#22d3ee);opacity:.9;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;
    cursor:pointer;box-shadow:0 0 0 4px rgba(124,92,255,.2),0 2px 7px rgba(0,0,0,.5);
    transition:transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.12)}

  .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .btn{appearance:none;border:none;border-radius:11px;padding:11px 24px;font-size:13px;
       font-weight:600;cursor:pointer;font-family:inherit;transition:.18s}
  .btn.primary{color:#fff;background:linear-gradient(135deg,#7c5cff,#a855f7 52%,#22d3ee);
               box-shadow:0 6px 22px rgba(124,92,255,.32)}
  .btn.primary:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(124,92,255,.46)}
  .btn.ghost{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line)}
  .btn.ghost:hover{background:rgba(255,255,255,.09)}
  .btn:disabled{opacity:.38;cursor:not-allowed;transform:none!important;box-shadow:none}
  .spacer{flex:1}

  .log{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;
       font:11px/1.7 ui-monospace,Consolas,monospace;color:var(--dim2);
       max-height:56px;overflow:hidden}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);
         background:rgba(20,22,30,.96);border:1px solid var(--line);color:var(--text);
         padding:10px 19px;border-radius:11px;font-size:12.5px;opacity:0;pointer-events:none;
         transition:.25s;z-index:50;box-shadow:0 10px 38px rgba(0,0,0,.6)}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:780px){
    .grid3{grid-template-columns:1fr}
    .fx{grid-template-columns:repeat(2,1fr)}
    .sliders{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo"><i></i></div>
    <h1>神光同步<em>RGB SYNC</em></h1>
    <div class="status">
      <span><span class="dot" id="dot"></span><span id="runText">未启动</span></span>
      <span class="mono" id="uptime">00:00</span>
    </div>
  </header>

  <!-- live desk preview -->
  <div class="desk">
    <div class="desk-label">桌面实时预览</div>
    <div class="stage">
      <div class="unit hs">
        <div class="body" id="seg-hs"></div>
        <div class="lbl"><b>耳机</b> · 单区</div>
      </div>
      <div class="unit nb">
        <div class="body" id="seg-nb"></div>
        <div class="lbl"><b>笔记本</b> · 单区</div>
      </div>
      <div class="unit kb">
        <div class="kbd" id="seg-kb"></div>
        <div class="lbl"><b>键盘</b> · 68 键逐键</div>
      </div>
    </div>
  </div>

  <div class="grid3" id="devices"></div>

  <div class="card">
    <h2>效果</h2>
    <div class="fx" id="fx"></div>
  </div>

  <div class="card">
    <h2>调节</h2>
    <div class="sliders">
      <div class="sl">
        <label>速度 <b id="spdVal">1.0×</b></label>
        <input type="range" id="spd" min="0.3" max="2.5" step="0.05" value="1">
      </div>
      <div class="sl">
        <label>亮度 <b id="pwrVal">100%</b></label>
        <input type="range" id="pwr" min="0.2" max="1" step="0.01" value="1">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="actions">
      <button class="btn primary" id="btnStart">启动</button>
      <button class="btn ghost" id="btnStop" disabled>停止</button>
      <div class="spacer"></div>
      <button class="btn ghost" id="btnHub">关闭 M HUB</button>
    </div>
    <div class="log" id="log"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let catalog = [], selected = "trio", running = false;

const rgb  = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const rgba = (c,a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

function toast(m){
  const t = $("#toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2000);
}
async function api(path, body){
  const opt = body ? {method:"POST",headers:{"Content-Type":"application/json"},
                      body:JSON.stringify(body)} : {};
  try{ return await (await fetch(path, opt)).json(); }catch(e){ return {}; }
}

function renderEffects(){
  $("#fx").innerHTML = catalog.map(e => `
    <button data-id="${e.id}" class="${e.id===selected?"sel":""}">
      <span class="fx-n">${e.label}</span><span class="fx-d">${e.hint}</span>
    </button>`).join("");
  $("#fx").querySelectorAll("button").forEach(b=>{
    b.onclick = async () => {
      selected = b.dataset.id;
      $("#fx").querySelectorAll("button").forEach(x=>x.classList.toggle("sel", x.dataset.id===selected));
      if(running) await api("/api/settings", {effect:selected});
      tick();
    };
  });
}

function renderDevices(devs){
  const box = $("#devices"), ico = {headset:"🎧", laptop:"💻", keyboard:"⌨️"};
  if(box.children.length !== devs.length){
    box.innerHTML = devs.map(d=>`
      <div class="dev" id="dev-${d.id}">
        <div class="glow"></div><div class="ico">${ico[d.id]||"◍"}</div>
        <div class="meta"><div class="nm">${d.label}</div><div class="sb">${d.sub}</div></div>
        <div class="st">离线</div>
      </div>`).join("");
  }
  devs.forEach(d=>{
    const el = $("#dev-"+d.id); if(!el) return;
    const c = d.rgb || [45,45,55];
    el.querySelector(".glow").style.background = rgba(c,.88);
    const st = el.querySelector(".st");
    st.textContent = d.alive ? "已连接" : "离线";
    st.classList.toggle("on", !!d.alive);
    el.style.borderColor = d.alive ? rgba(c,.26) : "rgba(255,255,255,.085)";
  });
}

function renderPreview(list){
  const SHORT = {headset:"hs", laptop:"nb", keyboard:"kb"};
  list.forEach(p=>{
    if(p.id === "keyboard" && p.rows){
      const box = $("#seg-kb");
      const need = p.rows.map(r=>r.keys.length).join(",");
      if(box.dataset.shape !== need){
        box.dataset.shape = need;
        box.innerHTML = p.rows.map(r=>`<div class="krow">${
          r.keys.map(()=>`<span></span>`).join("")}</div>`).join("");
      }
      p.rows.forEach((r,ri)=>{
        const row = box.children[ri];
        if(!row) return;
        r.keys.forEach((k,ci)=>{
          const el = row.children[ci]; if(!el) return;
          el.style.flexGrow = k.w;
          el.style.background = rgb(k.rgb);
          el.style.boxShadow = `0 0 7px ${rgba(k.rgb,.55)}`;
        });
      });
    } else {
      const el = $("#seg-" + (SHORT[p.id] || p.id));
      if(!el) return;
      el.style.background =
        `linear-gradient(90deg, ${rgba(p.rgb,.86)}, ${rgb(p.rgb)})`;
      el.style.boxShadow =
        `0 0 30px ${rgba(p.rgb,.6)}, inset 0 0 20px ${rgba(p.rgb,.5)}`;
      el.style.border = `1px solid ${rgba(p.rgb,.75)}`;
    }
  });
}

const fmt = s => String(Math.floor(s/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0");

async function tick(){
  const st = await api("/api/state");
  if(!st.devices) return;
  running = st.running;
  $("#dot").classList.toggle("on", running);
  $("#uptime").textContent = fmt(st.uptime||0);
  $("#btnStart").disabled = running;
  $("#btnStart").textContent = running ? "运行中" : "启动";
  $("#btnStop").disabled = !running;

  const online = st.devices.filter(d=>d.alive).length;
  $("#runText").textContent = running ? `运行中 · ${online}/3 设备` : "未启动";

  if(st.effect && st.effect !== selected){
    selected = st.effect;
    $("#fx").querySelectorAll("button").forEach(b=>b.classList.toggle("sel", b.dataset.id===selected));
  }
  renderDevices(st.devices);
  renderPreview(st.preview || []);
  $("#log").innerHTML = (st.notes||[]).slice(-3).reverse()
                        .map(n=>`<div>${n}</div>`).join("");
}

$("#btnStart").onclick = async () => {
  await api("/api/start", {effect:selected,
                           speed:parseFloat($("#spd").value),
                           power:parseFloat($("#pwr").value)});
  toast("已启动"); tick();
};
$("#btnStop").onclick = async () => { await api("/api/stop", {}); toast("已停止"); setTimeout(tick,400); };
$("#btnHub").onclick = async () => {
  const r = await api("/api/killhub", {}); toast("M HUB: " + (r.detail||"已处理")); tick();
};
$("#spd").oninput = e => {
  $("#spdVal").textContent = parseFloat(e.target.value).toFixed(1) + "×";
  if(running) api("/api/settings", {speed:parseFloat(e.target.value)});
};
$("#pwr").oninput = e => {
  $("#pwrVal").textContent = Math.round(e.target.value*100) + "%";
  if(running) api("/api/settings", {power:parseFloat(e.target.value)});
};

(async function init(){
  const c = await api("/api/catalog");
  catalog = c.effects || []; selected = c.default || "trio";
  renderEffects(); tick(); setInterval(tick, 130);
})();

/* Closing the window must release the devices and the process. sendBeacon fires
   even as the page is torn down; the backend watchdog is the fallback if the
   browser kills the page without warning. */
function bye(){ try{ navigator.sendBeacon("/api/bye", "1"); }catch(e){} }
window.addEventListener("pagehide", bye);
window.addEventListener("beforeunload", bye);
</script>
</body>
</html>
